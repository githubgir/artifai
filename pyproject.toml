[project]
name = "artifai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.107.0",
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "openai>=2.41.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "python-multipart>=0.0.32",
    "requests>=2.32.3",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "playwright>=1.54.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
